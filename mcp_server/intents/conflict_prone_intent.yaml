# conflict_prone_intent.yaml
# Task-Level Intent: Fix 4 — Knowledge-conflict inversion (conflict_prone flagging)
#
# Co-located per IVD placement rules:
#   mcp_server/intents/{task}_intent.yaml
#
# Closes red-team break 1.4: unusual/idiosyncratic rules get ignored when the
# model's parametric prior wins over loaded context. Builds on Fix 4a warnings
# in verification_oracle_gating_intent.yaml (v1.6 MVP).

parent_intent: "../mcp_server_intent.yaml"

scope:
  level: "task"
  type: "feature"
  granularity: "fine"

metadata:
  feature_id: "conflict_prone"
  category: "verification"
  tags: ["validate", "conflict_prone", "anti_pattern", "red-team", "principle-2"]
  status: "implemented"
  introduced_version: "1.10.0"

intent:
  summary: "Fix 4: manual conflict_prone flag + execution_derived gating + anti_pattern prompt anchor; auto-detect permanently rejected."
  goal: |
    The v1.6 MVP warned when conflict_prone constraints lacked test or anti_pattern,
    but did not gate on execution_derived provenance — authors could mark unusual
    rules conflict_prone yet rely on human_authored or ai_generated tests that the
    model's prior can still override during implementation (knowledge-conflict
    inversion, arXiv 2409.08435).

    This intent completes Fix 4:
    - conflict_prone is a MANUAL author-set flag during Rule 4 Probe 5 (never auto-detected)
    - conflict_prone constraints MUST declare test_provenance: execution_derived + execution_oracle
    - ivd_validate emits verification_gating.conflict_prone for insufficient anchors
    - Agent rules require injecting anti_pattern into implementation context

    ivd_validate stays structure_only — no LLM classifier, no subprocess test runner.
  success_metric: |
    - Auto-detect conflict_prone in MCP server permanently rejected (documented constraint)
    - conflict_prone without execution_derived (+ execution_oracle) → verification_gating
    - conflict_prone missing test or anti_pattern → MISSING_ANCHOR gating
    - anti_pattern prompt-injection convention in cookbook + framework
    - ZERO regressions: report-only, legacy non-conflict_prone intents unchanged
  stakeholders:
    - "AI agents implementing idiosyncratic business rules from intent"
    - "IVD framework maintainer (Leo)"

constraints:
  - name: "anti_pattern_prompt_convention"
    requirement: |
      Agent Rule 1 documents that before implementing any conflict_prone constraint,
      the agent MUST inject that constraint's anti_pattern text into the active
      implementation context (not only store it in YAML). cookbook.md and framework.md
      document the same convention.
    test: "recipes/agent-rules-ivd.yaml"
    test_provenance: "human_authored"
    entropy: "near-zero"
    priority: 4
    consequence_if_violated: "Context loses to the parametric prior during codegen."

  - name: "auto_detect_permanently_rejected"
    requirement: |
      ivd_validate MUST NOT auto-detect or LLM-classify conflict_prone. Only an
      explicit author-set conflict_prone: true on a constraint triggers Fix 4 checks.
      alternatives in this intent document the rejection; no server-side semantic
      'unusual for domain' detector is added.
    test: "mcp_server/tests/unit/test_validate.py::TestConflictProne::test_non_conflict_prone_never_gates"
    test_provenance: "human_authored"
    entropy: "near-zero"
    priority: 3
    consequence_if_violated: "High-entropy auto-label replaces reliable manual flag (Rule 6 violation)."

  - name: "conflict_prone_execution_derived_gating"
    requirement: |
      Any constraint with conflict_prone: true whose test_provenance is not
      execution_derived, or which lacks an execution_oracle block when execution_derived,
      is listed in verification_gating.conflict_prone.constraints_needing_execution_derived
      with status NEEDS_EXECUTION_DERIVED (or MIXED when combined with MISSING_ANCHOR).
    test: "mcp_server/tests/unit/test_validate.py::TestConflictProne::test_conflict_prone_without_execution_derived_gates"
    test_provenance: "execution_derived"
    execution_oracle:
      type: "property_test"
      property: "invariant"
    conflict_prone: true
    anti_pattern: "The common pattern is to trust prose or human_authored tests for unusual rules; this system requires NOT-that — execution_derived + execution_oracle only."
    entropy: "near-zero"
    priority: 2
    consequence_if_violated: "Unusual rules verify green while the prior wins in implementation."

  - name: "backward_compat_no_new_errors"
    requirement: "All new checks emit warnings/gating only; none add to errors. Intents without conflict_prone unchanged."
    test: "mcp_server/tests/unit/test_validate.py::TestBackwardCompatibility::test_new_fields_never_produce_errors"
    test_provenance: "execution_derived"
    entropy: "near-zero"
    priority: 1
    consequence_if_violated: "Existing IVD users' intents break on upgrade."

constraint_satisfiability:
  conflicts_checked: true
  known_tensions:
    - between: ["conflict_prone_execution_derived_gating", "verification_oracle_gating MVP"]
      resolution: |
        A conflict_prone constraint with ai_generated also appears in
        constraints_needing_external_oracle (Fix 1). Both sub-blocks may appear;
        agent must clear both before PASS.
    - between: ["conflict_prone_execution_derived_gating", "backward_compat_no_new_errors"]
      resolution: "Gating is report-only; valid stays True."
  simultaneous_satisfaction: "All four satisfiable: manual flag + gating + docs; no auto-detect."
  joint_satisfaction_test: "mcp_server/tests/unit/test_validate.py::TestConflictProne::test_conflict_prone_execution_derived_with_oracle_no_gating"

rationale:
  decision: "Manual conflict_prone + execution_derived gating + anti_pattern prompt injection; no auto-detect."
  reasoning: |
    Detecting 'conflicts with model prior' is itself fuzzy LLM judgment (Rule 6).
    Authors who know their domain mark conflict_prone during stress test. Those
    constraints need harder evidence (execution_derived oracle) and explicit NOT-A
    anchoring in the implementation prompt, not just YAML storage.
  evidence: "Red-team Fix 4 (2026-06-17); arXiv 2409.08435 (knowledge conflict)."
  date: "2026-06-18"
  stakeholder: "Leo"

alternatives:
  - name: "Auto-detect conflict_prone via LLM in ivd_validate"
    rejected_because: "Permanently rejected — high interpretive entropy (Rule 6). Unreliable; false positives flood intents."
    when_it_works: "Never in structure-only MCP server; revisit only with execution-derived evidence pipeline outside validate."
  - name: "Require conflict_prone for all constraints"
    rejected_because: "Noise — most constraints align with the prior; flag only unusual/idiosyncratic rules."

risks:
  - condition: "Authors set conflict_prone on everything"
    action: "Rule 4 Probe 5 limits to UNUSUAL-for-domain rules; review_gate ranks by risk."
    monitor: "conflict_prone count per intent"
    severity: "low"

implementation:
  current: "mcp_server/tools/validate.py"
  function: "validate_artifact_tool"
  version: 1
  tests: "mcp_server/tests/unit/test_validate.py"
  documentation: "templates/intent.yaml, recipes/agent-rules-ivd.yaml, cookbook.md, framework.md"

verification:
  test_cases:
    - name: "human_authored_conflict_prone_gated"
      description: "conflict_prone + human_authored → NEEDS_EXECUTION_DERIVED gating."
      input: "constraint with conflict_prone true, test_provenance human_authored, anti_pattern set"
      expected_output: "verification_gating.conflict_prone.status NEEDS_EXECUTION_DERIVED"
      validates_constraint: "conflict_prone_execution_derived_gating"
    - name: "execution_derived_oracle_clear"
      description: "conflict_prone + execution_derived + execution_oracle + anti_pattern → no conflict gating."
      input: "fully anchored conflict_prone constraint"
      expected_output: "no verification_gating.conflict_prone block"
      validates_constraint: "conflict_prone_execution_derived_gating"

changelog:
  - version: 1
    date: "2026-06-18"
    change: "Fix 4 completion: execution_derived gating, anti_pattern convention, auto-detect rejection."
    reason: "Red-team remediation — protect idiosyncratic rules from knowledge-conflict inversion."
