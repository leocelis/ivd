# external_oracle_unverified_intent.yaml
# Task-Level Intent: Fix 1 completion — UNVERIFIED gating + execution_oracle schema
#
# Co-located per IVD placement rules:
#   mcp_server/intents/{task}_intent.yaml
#
# Builds on verification_oracle_gating_intent.yaml (v1.6 MVP: test_provenance +
# NEEDS_EXTERNAL_ORACLE). This intent closes the remaining Fix 1 gaps from the
# red-team remediation design without adding a server-side test runner.

parent_intent: "../mcp_server_intent.yaml"

scope:
  level: "task"
  type: "feature"
  granularity: "fine"

metadata:
  feature_id: "external_oracle_unverified"
  category: "verification"
  tags: ["validate", "provenance", "unverified", "execution_oracle", "red-team", "principle-2"]
  status: "implemented"
  introduced_version: "1.7.0"

# ==============================================================================
# INTENT
# ==============================================================================

intent:
  summary: "Complete Fix 1: gate constraints with missing or non-executable tests as UNVERIFIED; add execution_oracle schema for golden/property oracles; keep ivd_validate structure-only."
  goal: |
    The v1.6 MVP gated ai_generated-only evidence as NEEDS_EXTERNAL_ORACLE but left
    two bypasses open: (1) constraints with no test or prose-only "tests" could still
    be reported PASS by agents; (2) execution_derived provenance had no structural
    anchor — authors could claim ground-truth without declaring a golden fixture or
    property test.

    This intent adds UNVERIFIED to verification_gating and an optional execution_oracle
    block per constraint. ivd_validate still does NOT run tests (structure_only contract).

    Test execution remains the agent's job in the Post-Implementation Verification
    Protocol; the server emits gating signals only.
  success_metric: |
    - Constraints with no test, non-executable test reference, or missing repo test file
      are listed in verification_gating.constraints_unverified (status UNVERIFIED or MIXED).
    - execution_oracle schema validated structurally (type, paths, property).
    - execution_derived without execution_oracle yields a warning.
    - ZERO regressions: report-only gating, legacy intents stay valid:true.
  stakeholders:
    - "AI agents running the IVD verification protocol"
    - "IVD framework maintainer (Leo)"

# ==============================================================================
# CONSTRAINTS — most critical LAST
# ==============================================================================

constraints:
  - name: "execution_oracle_schema_validation"
    requirement: |
      When a constraint declares execution_oracle, type MUST be one of
      {golden_fixture, property_test, differential_test}; golden_fixture requires
      path and expected; property_test requires property in {round_trip, invariant,
      idempotent}; invalid values or missing repo paths yield warnings only.
    test: "mcp_server/tests/unit/test_validate.py::TestExecutionOracle::test_invalid_oracle_type_warns"
    test_provenance: "human_authored"
    entropy: "near-zero"
    priority: 4
    consequence_if_violated: "Authors claim execution-derived ground truth without a checkable oracle."

  - name: "execution_derived_nudge"
    requirement: |
      A constraint with test_provenance execution_derived and no execution_oracle
      block produces a warning recommending one.
    test: "mcp_server/tests/unit/test_validate.py::TestExecutionOracle::test_execution_derived_without_oracle_warns"
    test_provenance: "human_authored"
    entropy: "near-zero"
    priority: 3
    consequence_if_violated: "execution_derived is claimed without structural backing."

  - name: "unverified_gating"
    requirement: |
      Any constraint with no test field, a non-executable test reference (no .py::
      pytest path), or a repo-relative test file that does not exist on disk is listed
      in verification_gating.constraints_unverified. Status is UNVERIFIED when only
      unverified; MIXED when combined with NEEDS_EXTERNAL_ORACLE constraints.
    test: "mcp_server/tests/unit/test_validate.py::TestUnverifiedGating::test_missing_test_is_unverified"
    test_provenance: "execution_derived"
    execution_oracle:
      type: "property_test"
      property: "invariant"
    entropy: "near-zero"
    priority: 2
    consequence_if_violated: "Prose-only or missing tests still get reported PASS — verification theater."

  - name: "backward_compat_no_new_errors"
    requirement: "All new checks emit warnings/gating notes only; none add to errors. Legacy intents stay valid:true."
    test: "mcp_server/tests/unit/test_validate.py::TestBackwardCompatibility::test_new_fields_never_produce_errors"
    test_provenance: "execution_derived"
    entropy: "near-zero"
    priority: 1
    consequence_if_violated: "Existing IVD users' intents break on upgrade."

constraint_satisfiability:
  conflicts_checked: true
  known_tensions:
    - between: ["unverified_gating", "backward_compat_no_new_errors"]
      resolution: |
        UNVERIFIED is a verification_gating report field, never an error. valid stays True.
    - between: ["unverified_gating", "verification_oracle_gating MVP"]
      resolution: |
        A constraint can appear in both constraints_unverified and
        constraints_needing_external_oracle; status becomes MIXED.
  simultaneous_satisfaction: "All four satisfiable: gating is report-only; errors untouched."

# ==============================================================================
# RATIONALE
# ==============================================================================

rationale:
  decision: "Extend verification_gating with UNVERIFIED + execution_oracle schema; no test runner."
  reasoning: |
    Signal hierarchy: ground-truth (golden fixture) > proxy (human test) > self-critique
    (ai_generated). v1.6 handled ai_generated. UNVERIFIED closes the no-test bypass.
    execution_oracle gives execution_derived a structural anchor without executing code.
  evidence: "Red-team Fix 1 design (2026-06-17); arXiv 2511.21382 (LLM test circularity)."
  date: "2026-06-18"
  stakeholder: "Leo"

alternatives:
  - name: "ivd_validate runs tests in sandbox"
    rejected_because: "Same rejection as verification_oracle_gating_intent — structure_only + security."
    when_it_works: "Dedicated isolated test-runner service — out of scope."

risks:
  - condition: "Bare pytest stubs like t.py::t in docs flagged UNVERIFIED"
    action: "Existence check only for repo-relative paths (contains / or known prefixes)."
    monitor: "unit test fixtures"
    severity: "low"

implementation:
  current: "mcp_server/tools/validate.py"
  function: "validate_artifact_tool"
  version: 1
  tests: "mcp_server/tests/unit/test_validate.py"
  documentation: "templates/intent.yaml, recipes/agent-rules-ivd.yaml, cookbook.md"

verification:
  test_cases:
    - name: "missing_test_unverified"
      description: "Constraint without test appears in constraints_unverified."
      input: "intent with one constraint, no test field"
      expected_output: "verification_gating.status UNVERIFIED"
      validates_constraint: "unverified_gating"

changelog:
  - version: 1
    date: "2026-06-18"
    change: "Fix 1 completion: UNVERIFIED gating + execution_oracle schema."
    reason: "Red-team remediation — close no-test and self-oracle bypasses."
