# ==============================================================================
# IVD Recipe: Capture Correction (Judgment Phase)
# ==============================================================================
# Version: 1.0
# Created: 2026-03-21
# Category: judgment
# ==============================================================================

recipe:
  name: "Capture Correction"
  version: "1.0"
  category: "judgment"
  created: "2026-03-21"
  author: "Leo Celis"

  description: |
    Standard pattern for capturing a single correction or observation into
    the IVD Judgment ledger. A "correction" is any moment where the output
    of an AI-driven workflow did not match what the domain expert (or the
    audience, or the runtime) expected.

    This recipe wraps the two-step capture-then-codify flow:
      1. Raw capture (fast, no structure required)
      2. Codify (returns a structured prompt; agent fills it; persist via
         ivd_judgment_save_codified)

    Captured corrections are the raw material the rest of the Judgment phase
    operates on — pattern detection, recommendations, and context injection
    all read from the ledger.

  applies_to:
    - "Domain expert spots an AI output that 'feels wrong'"
    - "Audience signal indicates a regression (downvote, low engagement, complaint)"
    - "Runtime exception or test failure traceable to an intent assumption"
    - "Reviewer (e.g. Erik in ADA) flags structural non-conformance"

  when_to_use:
    - "You can articulate what was wrong even if you can't yet articulate why"
    - "The correction is reproducible or worth recording for pattern detection"
    - "The project has the .judgment/ folder initialized (ivd_judgment_init was run)"

  when_NOT_to_use:
    - "Pre-production tinkering with no stable baseline yet (capture noise)"
    - "Stylistic preference with no audience or domain backing"
    - "Trivial typos / pure copy edits"
    - "Project has not initialized the Judgment phase (.judgment/ missing)"

# ------------------------------------------------------------------------------
# WORKFLOW
# ------------------------------------------------------------------------------

workflow_pattern:
  steps:
    - step: 1
      name: "Capture (raw)"
      tool: "ivd_judgment_capture"
      inputs:
        - "raw_correction (free text — what was wrong, what was expected)"
        - "domain (must match a baseline.yaml domain)"
        - "source (leo | audience | runtime | comparison)"
        - "leo_domain_depth (expert | practitioner | adjacent | novice)"
        - "originated_from_tool (optional — the tool/recipe that produced the artifact)"
      output: "ledger entry in state 'raw' under .judgment/ledger/"
      duration: "< 30 seconds"

    - step: 2
      name: "Codify (request structured prompt)"
      tool: "ivd_judgment_codify"
      inputs:
        - "entry_id (returned by step 1)"
      output: |
        Structured prompt that the agent fills with:
          - expected_result
          - detected_via
          - diagnosed_cause
          - proposed_fix
          - fix_action_type (+ capability_subtype if applicable)

    - step: 3
      name: "Save codified fields"
      tool: "ivd_judgment_save_codified"
      inputs:
        - "entry_id"
        - "5 codified fields filled by the agent"
      output: "ledger entry transitions state 'raw' → 'codified'"
      validation: "validator rejects if any codified field is missing or empty"

# ------------------------------------------------------------------------------
# VERIFICATION PATTERN
# ------------------------------------------------------------------------------

verification_pattern:
  continuous_checks:
    - check: "Every captured entry reaches 'codified' within 7 days"
      frequency: "weekly"
      command: "scan .judgment/ledger/ for state==raw older than 7 days"
      threshold: "< 5 stale raw entries"

    - check: "All 5 codified fields are non-empty"
      frequency: "per_entry"
      command: "ivd_validate (artifact_type='ledger_entry')"
      threshold: "100%"

    - check: "domain matches a baseline.yaml"
      frequency: "per_entry"
      command: "ivd_judgment_capture refuses unknown domains"
      threshold: "100%"

# ------------------------------------------------------------------------------
# BEST PRACTICES
# ------------------------------------------------------------------------------

best_practices:
  - practice: "Capture cheap, codify deliberately"
    why: "Raw capture must take < 30s or capture rate collapses. Codify is where structure happens."
    example: "Use a Cursor keystroke or chat slash-command to invoke ivd_judgment_capture during review."

  - practice: "Always set leo_domain_depth honestly"
    why: "Patterns are weighted by depth. Adjacent / novice corrections are recorded but down-weighted."
    example: "Tone in narrative writing = expert. Latency tuning of vector DB = adjacent."

  - practice: "Set originated_from_tool when the artifact came from a recipe or agent"
    why: "Enables tool-originated failure tracking — flags net-negative tools automatically."

  - practice: "Don't re-capture the same correction twice"
    why: "Pattern weights inflate artificially. Use ivd_judgment_pair if it's a comparison."

common_pitfalls:
  - pitfall: "Capturing every minor stylistic preference"
    symptom: "Ledger fills with low-signal entries; patterns drown in noise"
    fix: "Require either an audience signal OR an articulated diagnosed_cause before capture"

  - pitfall: "Skipping codify (entries stuck in 'raw')"
    symptom: "Pattern detector never sees them; ledger is dead weight"
    fix: "Weekly review: codify or delete every raw entry > 7 days old"

# ------------------------------------------------------------------------------
# REFERENCES
# ------------------------------------------------------------------------------

references:
  documentation:
    - "ivd/judgment_layer.md § Step 1 — Capture, § Step 2 — Codify"
    - "ivd/templates/ledger-entry.yaml"
  tools:
    - name: "ivd_judgment_capture"
    - name: "ivd_judgment_codify"
    - name: "ivd_judgment_save_codified"

