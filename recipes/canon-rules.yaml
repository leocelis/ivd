  - pattern: "agent-rules-ivd recipe"
    relationship: "Canon Rules and IVD Rules COMPOSE in the same agent instruction file. IVD Rules govern how the agent writes / verifies intent artifacts; Canon Rules govern how the agent talks to the human about anything. Both blocks use the BEGIN/END fence marker convention so canon_check_rules_installed and ivd_init can detect each independently."
  - pattern: "Phase 0b Canon MCP tools (canon_render, canon_check, canon_diff, canon_check_rules_installed)"
    relationship: "Phase 0a (this recipe) is the instructional layer; Phase 0b is the programmatic verifier. Composition (rules + verifier) is the recommended configuration (NFR-LA5)."
  - pattern: "Canon engine (ivd/canon/)"
    relationship: "The Canon engine implements R1–R14 in code. This recipe is the natural-language projection of R1, R2, R5, R10, R14 (the Phase 0a subset) into the agent's instruction file."
  - pattern: "Canon Browser Extension (Phase 0c — Canon Dots)"
    relationship: "The browser extension is the consumer surface for Canon. When users prefer not to install IVD or any rules, they can install the extension on claude.ai / chat.openai.com / gemini.google.com to get R2 dots on every reply. The same engine code backs both the MCP tools and the extension (layered_engine_reuse constraint)."

