# IVD Framework: Master Intent Artifact
# ==============================================================================
# This is the canonical reference for extending the IVD framework itself.
# All additions to IVD must align with this intent.
#
# Version: 3.1
# Created: 2026-01-24
# Updated: 2026-04-23 (Canon — Human Translation Layer bundled as Phase 0 surface;
#                       4 canon_* MCP tools hosted inside this server with zero
#                       client config edit; canon-rules recipe distributed as the
#                       canonical Phase 0a rules block; ivd_init reports per-file
#                       agent_rules_status: {ivd, canon}.)
