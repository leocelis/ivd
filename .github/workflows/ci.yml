name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_server/requirements.txt

      - name: Run tests
        run: python -m pytest mcp_server/tests --ignore=mcp_server/tests/smoke -q

  compliance:
    name: TrustLint (EU AI Act)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TrustLint
        run: |
          python -m pip install --upgrade pip
          pip install 'trustlint>=2.0.0'

      - name: Scan LLM-facing artifacts
        run: chmod +x scripts/compliance/check.sh && ./scripts/compliance/check.sh
