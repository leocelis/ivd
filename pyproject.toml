[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ivd-mcp"
version = "3.1.0"
description = "Intent-Verified Development — 30 MCP tools that make AI write, implement, and verify structured intent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Leo Celis" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-agents",
  "intent-driven-development",
  "llm",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "mcp>=1.28.1,<2",
  "starlette>=1.3.1,<2",
  "sse-starlette>=3.0.2,<4",
  "uvicorn>=0.35.0,<1",
  "redis>=5.0.0",
  "pyyaml>=6.0",
  "termcolor>=2.4.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
search = ["openai>=1.12.0", "tiktoken>=0.6.0"]
compliance = ["trustlint>=2.0.1"]
dev = ["pytest>=8.0.0", "pytest-anyio", "httpx>=0.27.0", "ruff>=0.6.0", "mypy>=1.10.0"]

[project.urls]
Homepage = "https://ivdframework.dev"
Repository = "https://github.com/leocelis/ivd"
Documentation = "https://github.com/leocelis/ivd/blob/main/README.md"
Changelog = "https://github.com/leocelis/ivd/blob/main/CHANGELOG.md"

[project.scripts]
ivd-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
include = [
  "mcp_server/**/*.py",
  "canon/**/*.py",
  "judgment/**/*.py",
  "recipes/**/*.yaml",
  "templates/**/*.yaml",
]
exclude = [
  "mcp_server/tests/**",
  "mcp_server/logs/**",
  "mcp_server/brain/**",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# UP (pyupgrade) intentionally excluded: the existing codebase uniformly uses
# typing.Optional/Dict/List (pre-dates this lint config). Enabling UP would
# flag every existing file without fixing any of them. Adopting modern typing
# (X | None, list/dict) is a deliberate future repo-wide change, not something
# new code should do unilaterally and become the one inconsistent file.
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["mcp_server/tests/", "examples/"]
