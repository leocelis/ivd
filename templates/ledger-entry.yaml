# {YYYY-MM-DD}_{short-slug}_correction.yaml
# Ledger Entry Template — IVD Judgment Phase
#
# IVD: THE FRAMEWORK FOR THE AI AGENTS ERA
# =========================================
# This template captures a single correction or comparison observation that
# enters the Judgment Phase via the .judgment/ledger/ folder.
#
# SCHEMA NOTE: This template matches the runtime schema used by
# `ivd_judgment_capture` (creator) and `validate_ledger_entry` (validator).
# Required fields: id, state, classification
# Required for state "codified": codified.{expected_result, detected_via,
#   diagnosed_cause, proposed_fix, fix_action_type}
#
# WORKFLOW:
#   1. ivd_judgment_capture(...)        → creates this file in state "raw"
#                                         under .judgment/ledger/raw/
#   2. ivd_judgment_codify(entry_id)    → returns a structured prompt
#   3. ivd_judgment_save_codified(...)  → fills codified block; moves to
#                                         .judgment/ledger/codified/
#   4. ivd_judgment_detect_patterns()   → clusters entries; promotes patterns
#   5. ivd_judgment_propose_recommendation(pattern_id)
#   6. After you applies the fix         → state → "resolved"
#   7. After 90+ days resolved           → state → "archived"
#
# PLACEMENT: <project_root>/.judgment/ledger/{state}/
# NAMING:    {YYYY-MM-DD}_{short-slug}_correction.yaml
#            e.g. 2026-03-21_proto-tone-regression_correction.yaml
#
# ACTIVATION: requires .judgment/ folder at project root.
# REFERENCE:  ivd/judgment_layer.md § "Step 1 — Capture" / § "Step 2 — Codify"

# ----------------------------------------------------------------------------
# IDENTITY
# ----------------------------------------------------------------------------

id: "{date-slug-correction}"         # REQUIRED — generated by ivd_judgment_capture
created: "{ISO-8601-with-timezone}"  # e.g. 2026-03-21T14:30:00-04:00

# ----------------------------------------------------------------------------
# STATE MACHINE
# ----------------------------------------------------------------------------
# One-way transitions only. The validator rejects backwards transitions.
#
#   raw → codified → (paired | pattern-member) → resolved → archived
#
# state values:
#   raw              just captured; codified block is null
#   codified         all 5 codified fields present; ready for pattern matching
#   paired           part of a comparison pair (entry_type == comparison_pair)
#   pattern-member   joined a pattern of >= 3 entries
#   resolved         the recommended fix was applied
#   archived         resolved >= 90 days ago; no longer injected

state: "raw"                         # REQUIRED

# ----------------------------------------------------------------------------
# CLASSIFICATION
# ----------------------------------------------------------------------------
# REQUIRED block — the validator checks for presence of the entire block.

classification:                      # REQUIRED
  type: "single_run"                 # single_run | comparison_pair
  source: "leo"                      # leo | audience | runtime | comparison
  domain: ""                         # REQUIRED — must match a baseline domain_id
  agent: ""                          # OPTIONAL — e.g. "script-writer", "lead-qualifier"
  model: ""                          # OPTIONAL — e.g. "claude-4-opus", "gpt-5"
  scope: ""                          # OPTIONAL — e.g. "narrative-pipeline"

# ----------------------------------------------------------------------------
# JUDGMENT WEIGHT
# ----------------------------------------------------------------------------
# your depth in this domain governs how much the entry weights the pattern.
# Filled at codify time; falls back to the domain baseline's leo_domain_depth.
# Erik (or any AI agent reviewer) is a STRUCTURAL conformance checker, not a
# quality judge — see ivd/judgment_layer.md § "Expert Intuition Principle."

leo_domain_depth: null               # null until codified; expert | practitioner | adjacent | novice

# ----------------------------------------------------------------------------
# PROVENANCE — was this caused by a tool we built?
# ----------------------------------------------------------------------------
# If the artifact under correction came from a specific tool/recipe, name it.
# Patterns where the same tool keeps appearing flag a net-negative tool —
# see ivd/judgment_layer.md § "Tool-Originated Failure Tracking."

originated_from_tool: null           # OPTIONAL — name of tool/recipe that produced the artifact

# ----------------------------------------------------------------------------
# RAW CAPTURE
# ----------------------------------------------------------------------------

raw_correction: |
  {what was wrong, what was expected, who/what flagged it}

# ----------------------------------------------------------------------------
# CODIFIED BLOCK — filled by ivd_judgment_save_codified
# ----------------------------------------------------------------------------
# All 5 sub-fields are REQUIRED to transition state to "codified".
# The block is null until codification is complete.

codified: null                       # replaced by a dict when codified:
  # expected_result: ""              # what should have happened
  # detected_via: ""                 # how was it caught:
  #                                  #   user_review | automated_test | audience_signal
  #                                  #   runtime_error | peer_review
  # diagnosed_cause: ""              # root cause hypothesis (name the mechanism)
  # proposed_fix: ""                 # specific, actionable
  # fix_action_type: ""              # prompt_patch | intent_revision
  #                                  # | capability_addition | domain_reassessment
  # capability_subtype: null         # REQUIRED if fix_action_type == capability_addition
  #                                  # build | buy | hire | partner
  # decision_rationale: ""           # why this sub-type

# ----------------------------------------------------------------------------
# PATTERN MEMBERSHIP — set automatically when joining a pattern
# ----------------------------------------------------------------------------

pattern_membership: null             # set when entry joins a pattern of >= 3

# ----------------------------------------------------------------------------
# RESOLUTION — filled when state transitions to "resolved"
# ----------------------------------------------------------------------------

resolution: null                     # replaced by a dict when resolved:
  # resolved_at: null                # ISO-8601
  # resolved_by_recommendation_id: null
  # resolution_notes: ""

# ----------------------------------------------------------------------------
# CHANGELOG — every state transition is appended here
# ----------------------------------------------------------------------------

changelog:
  - date: "{ISO-8601}"
    change: "captured (raw)"
